# ============================================================
# Splunk Universal Forwarder - outputs.conf
# 전송 대상: 내부망 Splunk Indexer
# 
# VMware ESXi 환경:
#   - splunk VM     : 10.0.200.201 (intra-net)
#   - docker host   : DMZ 10.0.10.X
#   - 방화벽         : pfsense (DMZ → INTRA 9997 ALLOW 필요)
# ============================================================

[tcpout]
defaultGroup = ticketing_indexers
forwardedindex.0.whitelist = (_audit|_internal|ticketing_.*)

[tcpout:ticketing_indexers]
# ★ VMware 환경의 실제 Splunk Indexer IP
server = 10.0.200.201:9997

# 압축 전송 (네트워크 대역폭 절약)
compressed = true

# 자동 재연결 (방화벽/네트워크 일시 단절 대비)
autoLBFrequency = 30
forceTimebasedAutoLB = true

# 보안 - 운영 환경 SSL 권장
# sslCertPath = $SPLUNK_HOME/etc/auth/server.pem
# sslPassword = password
# sslRootCAPath = $SPLUNK_HOME/etc/auth/ca.pem
