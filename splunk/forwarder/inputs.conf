# ============================================================
# Splunk Universal Forwarder - inputs.conf
# 모니터링 대상: 티켓팅 보안 로그 JSON 파일들
# ============================================================

[default]
host = ticketing-dmz-01

# ─── log_auth ───
[monitor:///var/log/ticketing/security/log_auth.json]
disabled = false
sourcetype = ticketing:log_auth
index = ticketing_security

# ─── log_seat ───
[monitor:///var/log/ticketing/security/log_seat.json]
disabled = false
sourcetype = ticketing:log_seat
index = ticketing_security

# ─── log_payment ───
[monitor:///var/log/ticketing/security/log_payment.json]
disabled = false
sourcetype = ticketing:log_payment
index = ticketing_security

# ─── log_admin_access ───
[monitor:///var/log/ticketing/security/log_admin_access.json]
disabled = false
sourcetype = ticketing:log_admin_access
index = ticketing_security

# ─── log_board ───
[monitor:///var/log/ticketing/security/log_board.json]
disabled = false
sourcetype = ticketing:log_board
index = ticketing_security

# ─── log_behavior_feature (MLTK 학습 대상) ───
[monitor:///var/log/ticketing/security/log_behavior_feature.json]
disabled = false
sourcetype = ticketing:log_behavior_feature
index = ticketing_mltk

# ─── application.log (일반 로그) ───
[monitor:///var/log/ticketing/security/application.log]
disabled = false
sourcetype = ticketing:application
index = ticketing_app
