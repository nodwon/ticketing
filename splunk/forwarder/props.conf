[ticketing:log_auth]
KV_MODE = json
TIME_PREFIX = "event_time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
TRUNCATE = 10000
SHOULD_LINEMERGE = false

