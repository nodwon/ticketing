# ============================================================
# Project   : 티켓팅 보안관제
# Compose   : DMZ Docker Host VM 전체 스택
# Usage     : docker compose up -d
#
# 구성:
#   1. oracle        : Oracle XE 21c
#   2. ticketing     : 티켓팅 웹 애플리케이션 (Tomcat 9)
#   3. splunkforwarder : 로그를 내부망 Splunk Indexer 로 전송
# ============================================================

version: '3.8'

services:

  # ============================================================
  # Oracle Database XE 21c
  # ============================================================
  oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: ticketing-oracle
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-TicketDev2026!}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      # 초기 스키마 / 시드 데이터
      - ./db/init:/opt/oracle/scripts/startup
    networks:
      - ticketing-net
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ============================================================
  # 티켓팅 웹 애플리케이션
  # ============================================================
  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticketing-app:1.0
    container_name: ticketing-app
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # JDBC 접속 정보 (jdbc.properties 의 ${db.xxx} 를 환경변수로 치환)
      JAVA_OPTS: >-
        -Dfile.encoding=UTF-8
        -DLOG_HOME=/var/log/ticketing/security
        -Ddb.driver=oracle.jdbc.OracleDriver
        -Ddb.url=jdbc:oracle:thin:@oracle:1521/XEPDB1
        -Ddb.username=TICKET_DEV
        -Ddb.password=${ORACLE_PWD:-TicketDev2026!}
    volumes:
      # 로그 디렉토리를 Splunk Forwarder 와 공유
      - ticketing-logs:/var/log/ticketing/security
    networks:
      - ticketing-net

  # ============================================================
  # Splunk Universal Forwarder
  #   - 로그 파일을 tail 하여 내부망 Splunk Indexer 로 전송
  # ============================================================
  splunkforwarder:
    image: splunk/universalforwarder:latest
    container_name: ticketing-forwarder
    restart: unless-stopped
    depends_on:
      - ticketing
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PWD:-SplunkAdmin2026!}
      # 내부망 Splunk Indexer 의 IP (VMware 환경에 맞게 수정)
      SPLUNK_STANDALONE_URL: ${SPLUNK_INDEXER:-192.168.20.10:9997}
    volumes:
      # 티켓팅 앱의 로그를 읽기 전용으로 마운트
      - ticketing-logs:/var/log/ticketing/security:ro
      # Forwarder 설정 (inputs.conf 등)
      - ./splunk/forwarder/inputs.conf:/opt/splunkforwarder/etc/system/local/inputs.conf
      - ./splunk/forwarder/outputs.conf:/opt/splunkforwarder/etc/system/local/outputs.conf
    networks:
      - ticketing-net

# ============================================================
# 네트워크 / 볼륨
# ============================================================
networks:
  ticketing-net:
    driver: bridge

volumes:
  oracle-data:
    driver: local
  ticketing-logs:
    driver: local
